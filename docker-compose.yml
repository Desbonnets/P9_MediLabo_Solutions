services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: medilabo
      POSTGRES_USER: medilabo
      POSTGRES_PASSWORD: medilabopass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U medilabo -d medilabo" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build: ./back
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/medilabo
      SPRING_DATASOURCE_USERNAME: medilabo
      SPRING_DATASOURCE_PASSWORD: medilabopass
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  notes:
    build: ./notes
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: medilabo_notes
    ports:
      - "8082:8082"
    depends_on:
      mongodb:
        condition: service_healthy

  risk:
    build: ./risk
    environment:
      SERVICES_PATIENT_URL: http://back:8081
      SERVICES_NOTES_URL: http://notes:8082
    ports:
      - "8083:8083"
    depends_on:
      - back
      - notes

  gateway:
    build: ./gateway
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      - back
      - notes
      - risk

  front:
    build:
      context: ./front
      target: dev
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  postgres_data:
  mongodb_data:
